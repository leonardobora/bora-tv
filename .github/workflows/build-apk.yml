name: APK

# Gera o APK em todo push de tag "v*" e publica como Release.
# Serve tambem para o amigo instalar: a Release tem link direto do APK.
#
# Assinatura: se os secrets abaixo existirem, o APK sai assinado com a chave de
# release (mesma de sempre -> atualizacao instala por cima). Sem eles, o build
# sai com a debug key do Android (serve para testar, nao para distribuir).
#
#   KEYSTORE_BASE64        keystore .jks em base64
#   KEYSTORE_PASSWORD      senha da keystore
#   KEY_ALIAS              alias da chave
#   KEY_PASSWORD           senha da chave

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Build do release"
        working-directory: android-tv
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: "Assinar com a chave de release, se houver secrets"
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=android-tv/app/build/outputs/apk/release/app-release.apk
          OUT="iptvnator-tv-${GITHUB_REF_NAME#v}.apk"
          cp "$APK" "$RUNNER_TEMP/in.apk"
          zip -q -d "$RUNNER_TEMP/in.apk" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" || true
          "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/in.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT"

      - name: "Fallback sem secrets, usando o APK do Gradle"
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          OUT="iptvnator-tv-${GITHUB_REF_NAME#v}-debugkey.apk"
          cp android-tv/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT"

      - name: "Artefato do workflow"
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: "Release, somente em tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          body: |
            APK para Android TV, Google TV e celular (Android 6+).

            Instalar por adb:
            ```
            adb install -r ${{ env.APK_NAME }}
            ```
            Ou baixe direto no aparelho e abra o arquivo.
